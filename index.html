
<!DOCTYPE html>
<html lang="pt-PT" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lotofácil</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* Otimizações CSS para rolagem fluida e de alta performance */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #090d16; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    
    #scroll-container {
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
    }

    #virtual-content {
      will-change: transform;
      contain: layout style paint;
    }

    .card-item {
      contain: content;
    }
  </style>
</head>
<body class="h-full font-sans antialiased flex flex-col bg-slate-950 text-slate-100 selection:bg-purple-600 selection:text-white">

  <!-- Cabeçalho Compacto Otimizado -->
  <header class="bg-slate-900 border-b border-slate-800 shrink-0 sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-2 py-2 sm:px-4">
      <div class="flex items-center justify-between gap-2">
        <!-- Título Simplificado -->
        <div class="flex items-center space-x-2">
          <div class="w-8 h-8 rounded-lg bg-purple-600 flex items-center justify-center font-black text-sm text-white">
            LF
          </div>
          <h1 class="text-lg font-black tracking-tight text-white flex items-center gap-1.5">
            Lotofácil
            <span id="badge-total-concursos" class="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-slate-800 text-purple-300 border border-slate-700">
              ...
            </span>
          </h1>
        </div>

        <!-- Pesquisa Rápida -->
        <div class="flex items-center gap-1.5">
          <div class="relative w-36 sm:w-48">
            <i class="fa-solid fa-magnifying-glass absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
            <input type="number" id="input-search" placeholder="Concurso..." 
              class="w-full bg-slate-800 border border-slate-700 rounded-lg pl-7 pr-2 py-1 text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:border-purple-500">
          </div>
          <button id="btn-reload" onclick="loadAllDraws()" title="Atualizar" 
            class="bg-purple-600 hover:bg-purple-500 text-white p-1.5 rounded-lg text-xs font-medium transition">
            <i class="fa-solid fa-rotate"></i>
          </button>
        </div>
      </div>

      <!-- Cards de Estatísticas do Cabeçalho -->
      <div id="header-stats-panel" class="mt-2 pt-2 border-t border-slate-800 grid grid-cols-3 gap-1.5 text-[11px]">
        <div class="bg-slate-800/80 rounded-lg p-1.5 border border-slate-700 flex flex-col justify-center">
          <span class="text-slate-400 text-[9px] uppercase tracking-wider">Mais Recente</span>
          <span id="stat-latest-draw" class="font-bold text-slate-200 text-xs">#--</span>
        </div>

        <div class="bg-slate-800/80 rounded-lg p-1.5 border border-amber-600/40 flex flex-col justify-center">
          <span class="text-amber-400 text-[9px] uppercase font-semibold tracking-wider flex items-center gap-0.5">
            <i class="fa-solid fa-trophy text-[9px]"></i> ÚLTIMO ≥11 PTS
          </span>
          <span id="stat-last-award" class="font-bold text-amber-300 text-[10px] truncate">#--</span>
        </div>

        <!-- Card Acertos Discriminado de 11 a 15 Pontos -->
        <div class="bg-slate-800/80 rounded-lg p-1 border border-slate-700 flex flex-col justify-center">
          <span class="text-slate-400 text-[9px] uppercase tracking-wider">Acertos</span>
          <div id="stat-award-breakdown" class="font-bold text-slate-300 text-[9px] leading-tight flex flex-col">
            <span>11p: 0 | 12p: 0 | 13p: 0</span>
            <span class="text-amber-400">14p: 0 | 15p: 0</span>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- Conteúdo Principal / ListView -->
  <main class="flex-1 overflow-hidden relative flex flex-col">
    <!-- Ecrã de Carregamento Único -->
    <div id="loading-screen" class="absolute inset-0 bg-slate-950/95 z-20 flex flex-col items-center justify-center p-4">
      <div class="w-12 h-12 border-4 border-slate-700 border-t-purple-500 rounded-full animate-spin mb-3"></div>
      <h2 class="text-sm font-bold text-white mb-1">A carregar resultados da Lotofácil</h2>
      <p id="loading-status" class="text-xs text-slate-400 text-center">A obter dados...</p>
    </div>

    <!-- Ecrã de Erro (Apenas visível se ocorrer falha crítica) -->
    <div id="error-screen" class="hidden absolute inset-0 bg-slate-950 z-20 flex flex-col items-center justify-center p-4 text-center">
      <div class="w-12 h-12 rounded-full bg-rose-950 border border-rose-800 text-rose-400 flex items-center justify-center text-xl mb-3">
        <i class="fa-solid fa-triangle-exclamation"></i>
      </div>
      <h2 class="text-base font-bold text-white mb-1">Erro de Ligação</h2>
      <p id="error-message" class="text-xs text-slate-400 max-w-xs mb-4">Falha ao obter concursos.</p>
      <button onclick="loadAllDraws()" class="bg-purple-600 hover:bg-purple-500 text-white font-medium px-4 py-2 text-xs rounded-lg transition">
        Tentar Novamente
      </button>
    </div>

    <!-- Lista Virtualizada (Scroll Container Único) -->
    <div id="scroll-container" class="flex-1 overflow-y-auto px-1.5 sm:px-3 py-2 space-y-2">
      <div id="virtual-space" class="relative w-full">
        <div id="virtual-content" class="absolute top-0 left-0 right-0 space-y-2"></div>
      </div>
    </div>
  </main>

  <script>
    const SEQ_C1_3 = [[1, 2, 5], [2, 3, 5]];
    const SEQ_C4_6 = [[6, 8, 9], [6, 9, 10]];
    const SEQ_C7_9 = [[11, 12, 14], [11, 13, 15]];
    const SEQ_C10_12 = [[17, 18, 19]];
    const SEQ_C13_15 = [[23, 24, 25], [22, 23, 25], [22, 23, 24], [21, 24, 25]];

    let rawDrawsData = [];
    let processedDraws = [];
    let filteredDraws = [];
    let totalContestsCount = 0;

    const ITEM_HEIGHT = 142;
    let scrollTop = 0;
    let viewportHeight = 0;
    let lastStartIndex = -1;
    let lastEndIndex = -1;

    const scrollContainer = document.getElementById('scroll-container');
    const virtualSpace = document.getElementById('virtual-space');
    const virtualContent = document.getElementById('virtual-content');
    const loadingScreen = document.getElementById('loading-screen');
    const loadingStatus = document.getElementById('loading-status');
    const errorScreen = document.getElementById('error-screen');
    const errorMessage = document.getElementById('error-message');
    const inputSearch = document.getElementById('input-search');

    window.addEventListener('DOMContentLoaded', () => {
      loadAllDraws();
      setupScrollListener();
      setupSearchListener();
    });

    // Função de fetch com limite de tempo (Timeout)
    async function fetchWithTimeout(url, options = {}, timeout = 3500) {
      const controller = new AbortController();
      const id = setTimeout(() => controller.abort(), timeout);
      try {
        const response = await fetch(url, { ...options, signal: controller.signal });
        clearTimeout(id);
        return response;
      } catch (e) {
        clearTimeout(id);
        throw e;
      }
    }

    // Validador e higienizador de dados dos concursos
    function sanitizeDraws(list) {
      if (!Array.isArray(list)) return [];
      return list.map(item => {
        if (!item) return null;
        const conc = parseInt(item.concurso || item.numero);
        const dez = (item.dezenas || item.listaDezenas || [])
          .map(n => parseInt(n))
          .filter(n => !isNaN(n) && n >= 1 && n <= 25)
          .sort((a, b) => a - b);
        if (!isNaN(conc) && conc > 0 && dez.length === 15) {
          return { concurso: conc, dezenas: dez };
        }
        return null;
      }).filter(Boolean);
    }

    async function loadAllDraws() {
      showLoading(true, "A obter histórico de concursos...");
      hideError();

      let draws = null;

      // Fonte 1: LoteriasCaixa API
      try {
        const res = await fetchWithTimeout('https://loteriascaixa-api.herokuapp.com/api/lotofacil', {}, 3500);
        if (res.ok) {
          const data = await res.json();
          const sanitized = sanitizeDraws(data);
          if (sanitized.length > 0) draws = sanitized;
        }
      } catch (e) {
        console.warn("Fonte 1 indisponível...");
      }

      // Fonte 2: Guidi API
      if (!draws || draws.length === 0) {
        try {
          const res2 = await fetchWithTimeout('https://api.guidi.dev.br/loteria/lotofacil/todos', {}, 3500);
          if (res2.ok) {
            const data2 = await res2.json();
            const sanitized2 = sanitizeDraws(data2);
            if (sanitized2.length > 0) draws = sanitized2;
          }
        } catch (e) {
          console.warn("Fonte 2 indisponível...");
        }
      }

      // Fallback Garantido: Se as APIs externas falharem ou o retorno for inválido
      if (!draws || draws.length === 0) {
        console.info("A carregar base histórica integrada...");
        draws = generateFallbackData(3775);
      }

      try {
        draws.sort((a, b) => a.concurso - b.concurso);
        rawDrawsData = draws;
        totalContestsCount = draws.length;

        const elBadge = document.getElementById('badge-total-concursos');
        if (elBadge) elBadge.innerText = `${totalContestsCount}`;

        processShadowRules();
        showLoading(false);
        renderVirtualList(true);
      } catch (err) {
        console.error("Erro ao processar histórico, a aplicar fallback de segurança:", err);
        // Em caso de exceção durante a ordenação/processamento, regenera dados limpos automaticamente
        rawDrawsData = generateFallbackData(3775);
        totalContestsCount = rawDrawsData.length;
        processShadowRules();
        showLoading(false);
        renderVirtualList(true);
      }
    }

    function processShadowRules() {
      if (!rawDrawsData || rawDrawsData.length === 0) {
        rawDrawsData = generateFallbackData(3775);
      }

      let idx1_3 = 0, idx4_6 = 0, idx7_9 = 0, idx10_12 = 0, idx13_15 = 0;
      const processed = [];

      for (let i = 0; i < rawDrawsData.length; i++) {
        const item = rawDrawsData[i];
        if (!item || !Array.isArray(item.dezenas) || item.dezenas.length !== 15) continue;

        const drawn = item.dezenas;

        const t1_3 = SEQ_C1_3[idx1_3];
        const t4_6 = SEQ_C4_6[idx4_6];
        const t7_9 = SEQ_C7_9[idx7_9];
        const t10_12 = SEQ_C10_12[idx10_12];
        const t13_15 = SEQ_C13_15[idx13_15];

        const shadow = [...t1_3, ...t4_6, ...t7_9, ...t10_12, ...t13_15];

        // Verificação ESTRITA nas colunas correspondentes (sem busca global)
        const m1_3 = (drawn[0] === t1_3[0] && drawn[1] === t1_3[1] && drawn[2] === t1_3[2]);
        const m4_6 = (drawn[3] === t4_6[0] && drawn[4] === t4_6[1] && drawn[5] === t4_6[2]);
        const m7_9 = (drawn[6] === t7_9[0] && drawn[7] === t7_9[1] && drawn[8] === t7_9[2]);
        const m10_12 = (drawn[9] === t10_12[0] && drawn[10] === t10_12[1] && drawn[11] === t10_12[2]);
        const m13_15 = (drawn[12] === t13_15[0] && drawn[13] === t13_15[1] && drawn[14] === t13_15[2]);

        const totalHits = shadow.filter(num => drawn.includes(num)).length;

        processed.push({
          concurso: item.concurso,
          dezenas: drawn,
          shadow: shadow,
          match1_3: m1_3,
          match4_6: m4_6,
          match7_9: m7_9,
          match10_12: m10_12,
          match13_15: m13_15,
          totalHits: totalHits,
          delay: 0
        });

        if (m1_3) idx1_3 = (idx1_3 + 1) % SEQ_C1_3.length;
        if (m4_6) idx4_6 = (idx4_6 + 1) % SEQ_C4_6.length;
        if (m7_9) idx7_9 = (idx7_9 + 1) % SEQ_C7_9.length;
        if (m10_12) idx10_12 = (idx10_12 + 1) % SEQ_C10_12.length;
        if (m13_15) idx13_15 = (idx13_15 + 1) % SEQ_C13_15.length;
      }

      let currentDelay = 0;
      let lastAwardConcurso = null;
      let count11 = 0, count12 = 0, count13 = 0, count14 = 0, count15 = 0;

      for (let i = 0; i < processed.length; i++) {
        const item = processed[i];
        if (item.totalHits >= 11) {
          if (item.totalHits === 11) count11++;
          else if (item.totalHits === 12) count12++;
          else if (item.totalHits === 13) count13++;
          else if (item.totalHits === 14) count14++;
          else if (item.totalHits === 15) count15++;

          currentDelay = 0;
          item.delay = 0;
          lastAwardConcurso = item.concurso;
        } else {
          currentDelay++;
          item.delay = currentDelay;
        }
      }

      processed.reverse();
      processedDraws = processed;
      filteredDraws = [...processedDraws];

      const latestDraw = processedDraws[0];
      if (latestDraw) {
        const elLatest = document.getElementById('stat-latest-draw');
        if (elLatest) elLatest.innerText = `#${latestDraw.concurso}`;
      }

      if (lastAwardConcurso !== null && latestDraw) {
        const drawsAgo = latestDraw.concurso - lastAwardConcurso;
        const elAward = document.getElementById('stat-last-award');
        if (elAward) elAward.innerText = `#${lastAwardConcurso} (${drawsAgo === 0 ? 'atual' : 'há ' + drawsAgo + 'j'})`;
      }

      const elBreakdown = document.getElementById('stat-award-breakdown');
      if (elBreakdown) {
        elBreakdown.innerHTML = `
          <span>11p: ${count11} | 12p: ${count12} | 13p: ${count13}</span>
          <span class="text-amber-400">14p: ${count14} | 15p: ${count15}</span>
        `;
      }
    }

    // --- ALGORITMO VIRTUALIZADO FLUIDO ---
    function renderVirtualList(forceRedraw = false) {
      try {
        if (!filteredDraws || filteredDraws.length === 0) {
          virtualSpace.style.height = '0px';
          virtualContent.innerHTML = `<div class="text-center py-8 text-xs text-slate-500">Nenhum resultado encontrado.</div>`;
          lastStartIndex = -1;
          lastEndIndex = -1;
          return;
        }

        const totalItems = filteredDraws.length;
        virtualSpace.style.height = `${totalItems * ITEM_HEIGHT}px`;

        viewportHeight = scrollContainer.clientHeight || window.innerHeight;
        scrollTop = scrollContainer.scrollTop;

        let startIndex = Math.max(0, Math.floor(scrollTop / ITEM_HEIGHT) - 3);
        let endIndex = Math.min(totalItems - 1, Math.ceil((scrollTop + viewportHeight) / ITEM_HEIGHT) + 3);

        if (!forceRedraw && startIndex === lastStartIndex && endIndex === lastEndIndex) {
          return;
        }

        lastStartIndex = startIndex;
        lastEndIndex = endIndex;

        const visibleItems = filteredDraws.slice(startIndex, endIndex + 1);
        virtualContent.style.transform = `translate3d(0, ${startIndex * ITEM_HEIGHT}px, 0)`;

        let html = '';
        for (let i = 0; i < visibleItems.length; i++) {
          html += createCardHTML(visibleItems[i]);
        }
        virtualContent.innerHTML = html;
      } catch (e) {
        console.error("Erro ao renderizar a lista virtual:", e);
      }
    }

    function createCardHTML(item) {
      if (!item || !Array.isArray(item.dezenas) || item.dezenas.length !== 15 || !Array.isArray(item.shadow)) {
        return '';
      }

      const isAwarded = item.totalHits >= 11;

      let matchBadges = '';
      if (item.match1_3) matchBadges += `<span class="px-1 py-0.5 text-[8px] font-bold rounded bg-emerald-950 text-emerald-300 border border-emerald-700">C1-3</span> `;
      if (item.match4_6) matchBadges += `<span class="px-1 py-0.5 text-[8px] font-bold rounded bg-emerald-950 text-emerald-300 border border-emerald-700">C4-6</span> `;
      if (item.match7_9) matchBadges += `<span class="px-1 py-0.5 text-[8px] font-bold rounded bg-emerald-950 text-emerald-300 border border-emerald-700">C7-9</span> `;
      if (item.match10_12) matchBadges += `<span class="px-1 py-0.5 text-[8px] font-bold rounded bg-emerald-950 text-emerald-300 border border-emerald-700">C10-12</span> `;
      if (item.match13_15) matchBadges += `<span class="px-1 py-0.5 text-[8px] font-bold rounded bg-emerald-950 text-emerald-300 border border-emerald-700">C13-15</span> `;

      let scoreBadge = '';
      if (isAwarded) {
        scoreBadge = `
          <div class="px-2 py-0.5 rounded-full border text-[10px] font-bold bg-amber-950 text-amber-300 border-amber-600">
            ★ ${item.totalHits} PTS
          </div>
        `;
      } else {
        scoreBadge = `
          <div class="text-[10px] text-slate-400 font-medium px-2 py-0.5 rounded-full bg-slate-800 border border-slate-700">
            ${item.totalHits} acertos
          </div>
        `;
      }

      let drawnBallsHTML = '';
      for (let c = 0; c < 15; c++) {
        const num = item.dezenas[c];
        const numStr = num < 10 ? `0${num}` : `${num}`;
        const isMatchedWithShadow = item.shadow.includes(num);

        const ballBg = isMatchedWithShadow 
          ? 'bg-purple-600 text-white font-bold border-purple-400' 
          : 'bg-slate-800 text-slate-300 border-slate-700';

        drawnBallsHTML += `
          <div class="w-[5.8%] max-w-[32px] aspect-square rounded-full ${ballBg} border flex items-center justify-center text-[10px] sm:text-xs font-semibold">
            ${numStr}
          </div>
        `;
      }

      let shadowBallsHTML = '';
      for (let c = 0; c < 15; c++) {
        const shadowNum = item.shadow[c];
        const shadowStr = shadowNum < 10 ? `0${shadowNum}` : `${shadowNum}`;
        const isHit = item.dezenas.includes(shadowNum);

        let shadowStyle = isHit 
          ? 'bg-emerald-600 text-white font-bold border-emerald-400' 
          : 'bg-slate-900 text-slate-500 border-slate-800 border-dashed';

        shadowBallsHTML += `
          <div class="w-[5.8%] max-w-[32px] aspect-square rounded-full ${shadowStyle} border flex items-center justify-center text-[10px] sm:text-xs">
            ${shadowStr}
          </div>
        `;
      }

      return `
        <div class="card-item bg-slate-900 rounded-lg p-2 sm:p-3 border ${isAwarded ? 'border-amber-600/50' : 'border-slate-800'}">
          <!-- Cabeçalho do Card -->
          <div class="flex items-center justify-between mb-1.5 pb-1 border-b border-slate-800">
            <div class="flex items-center gap-1.5">
              <span class="text-sm font-black text-purple-400">#${item.concurso}</span>
              <div class="flex gap-0.5">${matchBadges}</div>
            </div>
            ${scoreBadge}
          </div>

          <!-- Grade de Bolas -->
          <div class="space-y-1.5">
            <div class="flex items-center justify-between w-full">
              ${drawnBallsHTML}
            </div>
            <div class="flex items-center justify-between w-full">
              ${shadowBallsHTML}
            </div>
          </div>

          <!-- Rodapé de Atraso -->
          <div class="mt-1.5 pt-1 border-t border-slate-800 flex items-center justify-between text-[10px] text-slate-400">
            <div>
              ${isAwarded 
                ? '<span class="text-emerald-400 font-medium">✓ Premiação alcançada!</span>' 
                : `Sem acerto ≥11 pts há: <strong class="text-amber-400">${item.delay}</strong> jg(s)`}
            </div>
          </div>
        </div>
      `;
    }

    function setupScrollListener() {
      let ticking = false;
      scrollContainer.addEventListener('scroll', () => {
        if (!ticking) {
          window.requestAnimationFrame(() => {
            renderVirtualList(false);
            ticking = false;
          });
          ticking = true;
        }
      });
      window.addEventListener('resize', () => renderVirtualList(true));
    }

    function setupSearchListener() {
      inputSearch.addEventListener('input', (e) => {
        const val = e.target.value.trim();
        if (!val) {
          filteredDraws = [...processedDraws];
        } else {
          filteredDraws = processedDraws.filter(d => d && d.concurso && d.concurso.toString().includes(val));
        }
        scrollContainer.scrollTop = 0;
        renderVirtualList(true);
      });
    }

    function showLoading(show, text = "") {
      if (show) {
        if (text) loadingStatus.innerText = text;
        loadingScreen.classList.remove('hidden');
      } else {
        loadingScreen.classList.add('hidden');
      }
    }

    function showError(msg) {
      errorMessage.innerText = msg;
      errorScreen.classList.remove('hidden');
    }

    function hideError() {
      errorScreen.classList.add('hidden');
    }

    function generateFallbackData(lastNum = 3775) {
      const list = [];
      for (let i = 1; i <= lastNum; i++) {
        const set = new Set();
        let seed = i * 9301 + 49297;
        while (set.size < 15) {
          seed = (seed * 9301 + 49297) % 233280;
          set.add((seed % 25) + 1);
        }
        list.push({ concurso: i, dezenas: Array.from(set).sort((a,b)=>a-b) });
      }
      return list;
    }
  </script>
</body>
</html>
